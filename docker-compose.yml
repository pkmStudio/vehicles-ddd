services:
    # Бэкенд (Laravel)
    app:
        build:
            context: .
            args:
                USER_ID: 1000
                GROUP_ID: 1000
                user: "www-data"
            dockerfile: docker/Dockerfile
        container_name: app-vehicles
        ports:
            - "9002:9000"
        volumes:
            - .:/var/www
            - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
            # Локальные pkmstudio/* пакеты (../packages, соседняя папка) — нужно для path-репозитория
            # с symlink в composer.json, пока пакет не опубликован на GitHub/Packagist.
            - ../packages:/packages:ro
            - ../packages:/var/packages:ro
        networks:
            - app-network   # внутренняя сеть проекта (app <-> pgsql)
            - dan-shared    # общая инфра: redis, rabbitmq (проект ~/projects/infra)
        depends_on:
            pgsql:
                condition: service_started
        restart: on-failure
        command: sh -c "composer update && php-fpm"

    # Horizon — менеджер воркеров очередей (замена supervisor для queue:work)
    horizon:
        build:
            context: .
            args:
                USER_ID: 1000
                GROUP_ID: 1000
                user: "www-data"
            dockerfile: docker/Dockerfile
        container_name: horizon-vehicles
        volumes:
            - .:/var/www
            - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
            - ../packages:/packages:ro
            - ../packages:/var/packages:ro
        networks:
            - app-network   # app <-> pgsql
            - dan-shared    # общая инфра: redis (хранилище Horizon), rabbitmq (очереди)
        depends_on:
            pgsql:
                condition: service_started
            app:
                condition: service_started
        restart: on-failure
        command: php artisan horizon

    # Nginx для бэкенда
    nginx:
        build:
            context: .
            dockerfile: docker/nginx/Dockerfile
        container_name: nginx-server-vehicles
        volumes:
            - ./docker/nginx/dev.default.conf:/etc/nginx/conf.d/default.conf
            - .:/var/www
        ports:
            - "8080:80"
            - "8443:443"
        networks:
            app-network:
            dan-shared:
                aliases:
                    - dan-vehicles
        depends_on:
            - app

    pgsql:
        image: postgres:17-alpine
        container_name: pgsql-vehicles
        env_file:
            - .env
        ports:
            - "5433:5432"
        environment:
            POSTGRES_DB: ${DB_DATABASE} # Пробрасываем из .env
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
        restart: unless-stopped
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}" ]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - app-network


volumes:
    postgres_data:

networks:
    app-network:
        driver: bridge
    # Общая инфра — сеть создаётся проектом ~/projects/infra, поэтому external.
    dan-shared:
        external: true
